trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  projectPath: src/AzPipelinesDemo.csproj
  testProjectPath: tests/AzPipelinesDemo.Tests/AzPipelinesDemo.Tests.csproj

steps:
- task: UseDotNet@2
  displayName: Use .NET 8 SDK
  inputs:
    packageType: sdk
    version: 8.x

- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: restore
    projects: |
      $(projectPath)
      $(testProjectPath)

- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    command: build
    projects: $(projectPath)
    arguments: --configuration $(buildConfiguration) --no-restore

- task: DotNetCoreCLI@2
  displayName: Test
  inputs:
    command: test
    projects: $(testProjectPath)
    arguments: --configuration $(buildConfiguration) --no-restore --logger trx --collect "XPlat Code Coverage"
    publishTestResults: true

- task: DotNetCoreCLI@2
  displayName: Publish
  inputs:
    command: publish
    publishWebProjects: false
    projects: $(projectPath)
    arguments: --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)
    zipAfterPublish: true

- task: PublishBuildArtifacts@1
  displayName: Publish Artifact
  inputs:
    PathtoPublish: $(Build.ArtifactStagingDirectory)
    ArtifactName: drop
    publishLocation: Container
